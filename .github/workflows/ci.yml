name: Check and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Resolve GitVersion package version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.gitversion.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate GitVersion 6.8.2
        id: gitversion
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install GitVersion.Tool --tool-path "$RUNNER_TEMP/gitversion" --version 6.8.2
          version="$("$RUNNER_TEMP/gitversion/dotnet-gitversion" /showvariable MajorMinorPatch)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v${version}(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || {
              echo "Tag does not match GitVersion MajorMinorPatch: $version" >&2
              exit 1
            }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "Release tag must point to a commit reachable from main." >&2
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  check:
    needs: version
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Compile Python sources
        run: python -m compileall -q Perfora PerforaSmokeTest tests scripts install.py
      - name: Test geometry, distribution, and installer
        run: python -m unittest discover -s tests -v
      - name: Build portable ZIP and checksum
        run: python install.py --zip --version "${{ needs.version.outputs.version }}"
      - name: Upload checked distribution
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Perfora-distribution
          path: dist/Perfora-*
          if-no-files-found: error

  release:
    name: Publish verified release
    needs: [version, check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-perfora
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Require reviewed notes for calculated version
        id: version
        shell: bash
        env:
          RESOLVED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$RESOLVED_VERSION"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -s "docs/releases/v$version.md" || {
            echo "Explicit release requires reviewed notes for v$version." >&2
            exit 1
          }
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Build versioned package for tested commit
        if: steps.version.outputs.publish == 'true'
        run: python install.py --zip --version "${{ steps.version.outputs.version }}"
      - name: Verify GitVersion, manifest, ZIP and SHA-256
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          channel=stable
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" || "${VERSION%%.*}" == 0 ]]; then
            channel=prerelease
          fi
          if [[ "$channel" == prerelease && "$GITHUB_REF_NAME" == "v$VERSION" ]]; then
            # Preserve the historic experimental classification of plain v0.x tags.
            python -c "import json,zipfile; p='dist/Perfora-$VERSION.zip'; z=zipfile.ZipFile(p); assert json.loads(z.read('Perfora/Perfora.manifest'))['version']=='$VERSION'"
            (cd dist && sha256sum -c "Perfora-$VERSION.zip.sha256")
          else
            python scripts/release_contract.py --version "$VERSION" --tag "$GITHUB_REF_NAME" --channel "$channel" \
              --manifest Perfora/Perfora.manifest --archive "dist/Perfora-$VERSION.zip" \
              --notes "docs/releases/v$VERSION.md"
          fi
      - name: Publish ZIP, checksum, and release notes
        if: steps.version.outputs.publish == 'true'
        run: python scripts/release.py --version "${{ steps.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}
