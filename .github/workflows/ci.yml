name: Check and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Compile Python sources
        run: python -m compileall -q Perfora PerforaSmokeTest tests scripts install.py
      - name: Test geometry, distribution, and installer
        run: python -m unittest discover -s tests -v
      - name: Build portable ZIP and checksum
        run: python install.py --zip
      - name: Upload checked distribution
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Perfora-distribution
          path: dist/Perfora-*
          if-no-files-found: error

  release:
    name: Publish experimental release
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-perfora
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Build tested commit
        run: python install.py --zip
      - name: Publish ZIP, checksum, and release notes
        run: python scripts/release.py
        env:
          GH_TOKEN: ${{ github.token }}
