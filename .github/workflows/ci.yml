name: Check and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: runtime-release-${{ github.workflow }}-${{ github.ref }}
  queue: max

permissions:
  contents: read

jobs:
  version:
    name: Resolve GitVersion package version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.gitversion.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve GitVersion (shared platform)
        id: gitversion
        uses: 4FusionLab/.github/.github/actions/resolve-version@ad9d60ba4aabc494b4f2c85d6c566a50ca423751

  changes:
    name: Check runtime changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.impact.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect runtime changes (shared platform)
        id: impact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: 4FusionLab/.github/.github/actions/runtime-changes@ad9d60ba4aabc494b4f2c85d6c566a50ca423751
        with:
          before: ${{ github.event.before }}
          after: ${{ github.sha }}
          paths-file: .github/release-paths.txt

  check:
    needs: version
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Compile Python sources
        run: python -m compileall -q Perfora PerforaSmokeTest tests scripts install.py
      - name: Test geometry, distribution, and installer
        run: python -m unittest discover -s tests -v
      - name: Build portable ZIP and checksum
        run: python install.py --zip --version "${{ needs.version.outputs.version }}"
      - name: Verify built Fusion ZIP and SHA-256 (shared contract)
        uses: 4FusionLab/.github/.github/actions/verify-archive@ad9d60ba4aabc494b4f2c85d6c566a50ca423751
        with:
          product: Perfora
          version: ${{ needs.version.outputs.version }}
          archives: dist/Perfora-${{ needs.version.outputs.version }}.zip
          manifest: Perfora/Perfora.manifest
      - name: Upload checked distribution
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Perfora-distribution
          path: dist/Perfora-*
          if-no-files-found: error

  release:
    name: Publish verified release
    needs: [version, check, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-perfora
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Capture tested GitVersion identity
        id: version
        shell: bash
        env:
          RESOLVED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$RESOLVED_VERSION"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Generate release notes (shared platform)
        uses: 4FusionLab/.github/.github/actions/release-notes@ad9d60ba4aabc494b4f2c85d6c566a50ca423751
        with:
          product: Perfora
          version: ${{ steps.version.outputs.version }}
          candidate: docs/releases/v${{ steps.version.outputs.version }}.md
          output: ${{ runner.temp }}/release-notes.md
      - name: Build versioned package for tested commit
        run: python install.py --zip --version "${{ steps.version.outputs.version }}"
      - name: Verify GitVersion, manifest, ZIP and SHA-256
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          channel=stable
          if [[ "${VERSION%%.*}" == 0 ]]; then channel=prerelease; fi
          # Keep legacy 0.x numeric tags; GitHub records those as prereleases.
          if [[ "$channel" == stable ]]; then
            python scripts/release_contract.py --version "$VERSION" --tag "v$VERSION" --channel stable \
              --manifest Perfora/Perfora.manifest --archive "dist/Perfora-$VERSION.zip" \
              --notes "${{ runner.temp }}/release-notes.md"
          else
            python -c "import json,zipfile; p='dist/Perfora-$VERSION.zip'; z=zipfile.ZipFile(p); assert json.loads(z.read('Perfora/Perfora.manifest'))['version']=='$VERSION'"
            (cd dist && sha256sum -c "Perfora-$VERSION.zip.sha256")
          fi
      - name: Verify ZIP, manifest and SHA-256 (shared platform)
        uses: 4FusionLab/.github/.github/actions/verify-archive@ad9d60ba4aabc494b4f2c85d6c566a50ca423751
        with:
          product: Perfora
          version: ${{ steps.version.outputs.version }}
          archives: dist/Perfora-${{ steps.version.outputs.version }}.zip
          manifest: Perfora/Perfora.manifest
          notes: ${{ runner.temp }}/release-notes.md
      - name: Publish ZIP, checksum, and release notes
        run: python scripts/release.py --version "${{ steps.version.outputs.version }}" --notes "${{ runner.temp }}/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
