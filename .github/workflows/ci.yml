name: Check and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: runtime-release-${{ github.workflow }}-${{ github.ref }}
  queue: max

permissions:
  contents: read

jobs:
  version:
    name: Resolve GitVersion package version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.gitversion.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate GitVersion 6.8.2
        id: gitversion
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install GitVersion.Tool --tool-path "$RUNNER_TEMP/gitversion" --version 6.8.2
          version="$("$RUNNER_TEMP/gitversion/dotnet-gitversion" /showvariable MajorMinorPatch)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
  changes:
    name: Check runtime changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.impact.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release path rules
        run: python scripts/release_changes.py --self-test
      - name: Detect shipped runtime changes
        id: impact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: python scripts/release_changes.py --before "$BEFORE" --after "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
  check:
    needs: version
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Compile Python sources
        run: python -m compileall -q Perfora PerforaSmokeTest tests scripts install.py
      - name: Test geometry, distribution, and installer
        run: python -m unittest discover -s tests -v
      - name: Build portable ZIP and checksum
        run: python install.py --zip --version "${{ needs.version.outputs.version }}"
      - name: Upload checked distribution
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Perfora-distribution
          path: dist/Perfora-*
          if-no-files-found: error

  release:
    name: Publish verified release
    needs: [version, check, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-perfora
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Prepare release notes and version
        id: version
        shell: bash
        env:
          RESOLVED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$RESOLVED_VERSION"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python scripts/release_notes.py --product Perfora --version "$version" \
            --output "$RUNNER_TEMP/release-notes.md" --candidate "docs/releases/v$version.md"
          echo "notes=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
      - name: Build versioned package for tested commit
        run: python install.py --zip --version "${{ steps.version.outputs.version }}"
      - name: Verify GitVersion, manifest, ZIP and SHA-256
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          channel=stable
          if [[ "${VERSION%%.*}" == 0 ]]; then channel=prerelease; fi
          # Keep legacy 0.x numeric tags; GitHub records those as prereleases.
          if [[ "$channel" == stable ]]; then
            python scripts/release_contract.py --version "$VERSION" --tag "v$VERSION" --channel stable \
              --manifest Perfora/Perfora.manifest --archive "dist/Perfora-$VERSION.zip" \
              --notes "${{ steps.version.outputs.notes }}"
          else
            python -c "import json,zipfile; p='dist/Perfora-$VERSION.zip'; z=zipfile.ZipFile(p); assert json.loads(z.read('Perfora/Perfora.manifest'))['version']=='$VERSION'"
            (cd dist && sha256sum -c "Perfora-$VERSION.zip.sha256")
          fi
      - name: Publish ZIP, checksum, and release notes
        run: python scripts/release.py --version "${{ steps.version.outputs.version }}" --notes "${{ steps.version.outputs.notes }}"
        env:
          GH_TOKEN: ${{ github.token }}
